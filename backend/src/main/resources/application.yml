server:
  port: 8080

spring:
  application:
    name: 945-industries-store
  datasource:
    url: jdbc:h2:mem:storedb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: "945IndustriesSecretKeyForJWTTokenGeneration2024MustBeLongEnough256Bits!!"
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173
